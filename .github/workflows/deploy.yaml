name: Deploy CustomerApp

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Required for Azure OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:

  # ==========================================================
  # DEPLOY API
  # ==========================================================
  deploy-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Enable Oryx build
        run: |
          az webapp config appsettings set \
            --resource-group p-auea-customerapp-rg \
            --name p-auea-customerapp-api \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: p-auea-customerapp-api
          package: ./api


  # ==========================================================
  # DEPLOY FRONTEND
  # ==========================================================
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Enable Oryx build
        run: |
          az webapp config appsettings set \
            --resource-group p-auea-customerapp-rg \
            --name p-auea-customerapp-frontend \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true

      - name: Deploy Frontend
        uses: azure/webapps-deploy@v3
        with:
          app-name: p-auea-customerapp-frontend
          package: ./frontend